name: 🧠 AI Dreaming Agent — Daily Memory Consolidation

on:
  schedule:
    # Run at 4:00 UTC = 0:00 AM New York time (EDT)
    - cron: '0 4 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  dream:
    name: Trigger Dreaming Agent
    runs-on: ubuntu-latest
    steps:
      - name: 🌙 Call Dreaming API (Primary Domain)
        run: |
          echo "🧠 Triggering Dreaming Agent at $(date -u '+%Y-%m-%d %H:%M UTC')..."
          
          # Try primary domain first
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 300 "https://bepoffice.com/api/cron/dreaming")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "📡 bepoffice.com → HTTP $HTTP_CODE"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Dreaming completed successfully via bepoffice.com!"
            exit 0
          fi
          
          # Fallback to Vercel domain
          echo "⚠️ Primary failed, trying fallback..."
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 300 "https://hao-ai.vercel.app/api/cron/dreaming")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "📡 hao-ai.vercel.app → HTTP $HTTP_CODE"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Dreaming completed successfully via fallback!"
            exit 0
          fi
          
          echo "❌ Dreaming failed on both domains"
          exit 1
